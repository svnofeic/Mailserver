name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Pebble, the ACME test server of Let's Encrypt: real certificate issuance in AcmePebbleTests (Linux only).
      - name: Start Pebble
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://github.com/letsencrypt/pebble/releases/download/v2.8.0/pebble-linux-amd64.tar.gz | tar xz -C /tmp
          cd /tmp
          openssl req -x509 -newkey rsa:2048 -nodes -keyout pebble-key.pem -out pebble-cert.pem -days 7 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          echo '{"pebble":{"listenAddress":"127.0.0.1:14000","managementListenAddress":"127.0.0.1:15000","certificate":"pebble-cert.pem","privateKey":"pebble-key.pem","httpPort":5002,"tlsPort":5001,"ocspResponderURL":"","externalAccountBindingRequired":false}}' > pebble.json
          echo "127.0.0.1 mail.example.test webmail.example.test" | sudo tee -a /etc/hosts
          chmod +x /tmp/pebble-linux-amd64/linux/amd64/pebble
          PEBBLE_VA_NOSLEEP=1 nohup /tmp/pebble-linux-amd64/linux/amd64/pebble -config pebble.json > pebble.log 2>&1 &
          for i in $(seq 1 30); do curl -skf https://127.0.0.1:14000/dir > /dev/null && break; sleep 1; done
          curl -skf https://127.0.0.1:14000/dir > /dev/null || { cat pebble.log; exit 1; }
          echo "PEBBLE_DIRECTORY=https://127.0.0.1:14000/dir" >> "$GITHUB_ENV"
      - run: dotnet test Mailserver.slnx -c Release

  # Ready-to-install Windows package (self-contained, no .NET needed on the server).
  # Pushes also publish it as the GitHub release "latest", which scripts/update.ps1 downloads:
  # https://github.com/svnofeic/Mailserver/releases/download/latest/mailserver-win-x64.zip
  package:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: release-latest
      cancel-in-progress: false
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/Mailserver.Service -c Release -r win-x64 --self-contained -o publish -p:Version=${{ env.VERSION }} -p:SourceRevisionId=${{ github.sha }}
      - run: dotnet publish src/Mailserver.Admin -c Release -r win-x64 --self-contained -o publish -p:Version=${{ env.VERSION }} -p:SourceRevisionId=${{ github.sha }}
      - run: |
          Copy-Item scripts/install.ps1, scripts/update.ps1 publish/
          New-Item -ItemType Directory publish/docs | Out-Null
          Copy-Item docs/*.md, README.md publish/docs/
          "$env:VERSION ($('${{ github.sha }}'.Substring(0, 7)))" | Set-Content publish/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mailserver-win-x64
          path: publish
          retention-days: 30
      - name: Publish release "latest"
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path publish/* -DestinationPath mailserver-win-x64.zip
          gh release delete latest --yes --cleanup-tag 2>$null
          $notes = "Version $(Get-Content publish/version.txt), Branch ${{ github.ref_name }}.`n`nAuf dem Server aktualisieren: C:\Mailserver\update.ps1 (PowerShell als Administrator)."
          gh release create latest mailserver-win-x64.zip scripts/update.ps1 --target ${{ github.sha }} --title "Mailserver $(Get-Content publish/version.txt)" --notes $notes
